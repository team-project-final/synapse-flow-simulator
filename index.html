<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse Flow Simulator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A1628;--bg-secondary:#0e1d35;--bg-tertiary:#122240;--bg-card:#15304a;
  --border:#1e3a5f;--text:#E8E0D8;--text-muted:#8a9ab5;--text-dim:#556b8a;
  --blue:#4FC3F7;--teal:#26c6da;--coral:#ff8a65;--amber:#ffb74d;--pink:#f06292;
  --purple:#b39ddb;--red:#ef5350;--green:#66bb6a;--gray:#78909c;--cyan:#4FC3F7;--ui-action:#4ade80;
  --sidebar-w:220px;--detail-w:280px;--log-h:140px;--header-h:48px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
}
html,body{height:100%;font-family:'IBM Plex Mono','Cascadia Code','Fira Code',monospace;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:var(--text)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Layout */
.app{display:grid;height:100dvh;height:100vh;grid-template-rows:var(--header-h) 1fr var(--log-h);grid-template-columns:var(--sidebar-w) 1fr var(--detail-w)}
@supports(height:100dvh){.app{height:100dvh}}
.header{grid-column:1/-1;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);background:var(--bg-secondary);border-bottom:1px solid var(--border);z-index:10}
.sidebar{grid-row:2;overflow-y:auto;background:var(--bg-secondary);border-right:1px solid var(--border);padding:var(--sp-2) 0}
.main-view{grid-row:2;position:relative;overflow:hidden;background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(30,58,95,.25) 39px,rgba(30,58,95,.25) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(30,58,95,.25) 39px,rgba(30,58,95,.25) 40px)}
.detail-panel{grid-row:2;overflow-y:auto;background:var(--bg-secondary);border-left:1px solid var(--border);padding:var(--sp-3)}
.log-panel{grid-column:1/-1;grid-row:3;overflow-y:auto;background:#060e1a;border-top:1px solid var(--border);padding:var(--sp-2) var(--sp-3);font-family:'IBM Plex Mono','Cascadia Code','Fira Code',monospace;font-size:12px;line-height:1.6}

/* Header */
.header .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:-.3px}
.header .logo span{color:var(--blue)}
.hamburger{display:none;font-size:20px;padding:4px}
.nav-controls{display:flex;align-items:center;gap:var(--sp-2);margin-left:auto}
.nav-controls button{padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;background:var(--bg-card);border:1px solid var(--border);transition:.15s;min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center}
.nav-controls button:hover{background:var(--border)}
.nav-controls button.active{background:rgba(79,195,247,.15);border-color:var(--cyan);color:var(--cyan)}
.nav-controls .sep{width:1px;height:var(--sp-5);background:var(--border);margin:0 var(--sp-1)}
.step-info{font-size:12px;color:var(--text-muted);min-width:80px;text-align:center}
.speed-btn{font-size:12px!important;padding:6px 10px!important;min-height:32px!important;min-width:32px!important}
.speed-btn.active{background:rgba(79,195,247,.15)!important;border-color:var(--cyan)!important;color:var(--cyan)!important}

/* Sidebar */
.sidebar .cat-group{margin-bottom:4px}
.sidebar .cat-header{padding:var(--sp-2) var(--sp-3) var(--sp-1);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);display:flex;align-items:center;gap:var(--sp-2)}
.sidebar .cat-dot{width:var(--sp-2);height:var(--sp-2);border-radius:50%;flex-shrink:0}
.sidebar .sc-item{padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-6);font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);border-radius:0 var(--sp-2) var(--sp-2) 0;margin-right:var(--sp-2);width:calc(100% - var(--sp-2));text-align:left;font-family:inherit;background:none;border:none}
.sidebar .sc-item:hover{background:var(--bg-tertiary);color:var(--text)}
.sidebar .sc-item.active{background:rgba(79,195,247,.08);color:var(--cyan);font-weight:500;border-left:2px solid var(--cyan)}
.sidebar .sc-item .status-dot{display:inline-block;width:var(--sp-2);height:var(--sp-2);border-radius:50%;margin-right:var(--sp-2)}
.status-implemented{background:var(--green)}
.status-partial{background:var(--amber)}
.status-w3_pending{background:var(--text-dim)}

/* Search */
.sidebar .search-wrap{padding:var(--sp-2) var(--sp-3);position:sticky;top:0;background:var(--bg-secondary);z-index:2}
.sidebar .search-input{width:100%;padding:var(--sp-2) var(--sp-3);padding-left:32px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border-color .15s}
.sidebar .search-input:focus{border-color:var(--cyan)}
.sidebar .search-input::placeholder{color:var(--text-dim)}
.sidebar .search-icon{position:absolute;left:calc(var(--sp-3) + 8px);top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;pointer-events:none}
.sidebar .search-clear{position:absolute;right:calc(var(--sp-3) + 6px);top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;cursor:pointer;display:none;background:none;border:none;padding:2px}
.sidebar .search-clear.visible{display:block}
.sidebar .sc-item .sc-meta{display:flex;gap:4px;align-items:center;margin-top:2px}
.sidebar .sc-item .sc-tag{font-size:9px;padding:0 4px;border-radius:3px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim)}
.sidebar .sc-item .sc-steps{font-size:10px;color:var(--text-dim)}
.sidebar .recent-section{padding:0 var(--sp-3) var(--sp-1);margin-bottom:var(--sp-1);border-bottom:1px solid var(--border)}
.sidebar .recent-label{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:var(--sp-1)}
.sidebar .filter-area{padding:0 var(--sp-3) var(--sp-2);display:flex;flex-wrap:wrap;gap:4px}
.sidebar .filter-chip{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.sidebar .filter-chip:hover{border-color:var(--text-muted)}
.sidebar .filter-chip.active{background:rgba(79,195,247,.15);border-color:var(--cyan);color:var(--cyan)}
.sidebar .filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:700;background:var(--cyan);color:var(--bg);margin-left:4px}
.sidebar .no-results{padding:var(--sp-4) var(--sp-3);text-align:center;color:var(--text-dim);font-size:12px}
.sidebar .no-results button{color:var(--cyan);background:none;border:none;cursor:pointer;font-size:12px;text-decoration:underline;margin-top:var(--sp-2);display:block;width:100%;font-family:inherit}

/* View Tabs */
.view-tabs{display:flex;gap:2px;background:var(--bg-tertiary);border-radius:8px;padding:2px}
.view-tabs button{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:.15s;min-height:32px}
.view-tabs button.active{background:transparent;color:var(--cyan);border-bottom:2px solid var(--cyan)}

/* Detail Panel */
.detail-panel h3{font-size:13px;font-weight:600;margin-bottom:var(--sp-2);color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.detail-panel .section{margin-bottom:var(--sp-4)}
.detail-panel .step-title{font-size:14px;font-weight:600;margin-bottom:var(--sp-2)}
.detail-panel .step-type{display:inline-block;padding:2px var(--sp-2);border-radius:var(--sp-1);font-size:11px;font-weight:600;margin-bottom:var(--sp-2)}
.detail-panel .step-action{font-size:13px;color:var(--text-muted);margin-bottom:var(--sp-2);word-break:break-all}
.detail-panel .payload-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--sp-2);padding:var(--sp-2);font-family:monospace;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.detail-panel .annotation{display:flex;align-items:flex-start;gap:var(--sp-2);font-size:12px;color:var(--text-muted);margin-bottom:var(--sp-1)}
.detail-panel .annotation::before{content:'\25B6';font-size:8px;color:var(--amber);margin-top:3px;flex-shrink:0}
.detail-panel .branch-section{margin-top:var(--sp-2)}
.detail-panel .branch-item{display:block;padding:var(--sp-2);margin-bottom:var(--sp-1);background:var(--bg);border:1px solid var(--border);border-radius:var(--sp-2);font-size:12px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.detail-panel .branch-item:hover{border-color:var(--blue)}
.detail-panel .branch-item.failure{border-left:3px solid var(--red)}
.detail-panel .branch-item.alternate{border-left:3px solid var(--amber)}
.detail-panel .branch-item .trigger{font-weight:500;margin-bottom:2px}
.detail-panel .branch-item .result{color:var(--text-muted);font-size:11px}
.detail-panel .branch-detail{background:var(--bg);border:1px solid var(--border);border-radius:var(--sp-2);padding:var(--sp-2);margin-top:var(--sp-2);font-size:12px}
.detail-panel .branch-detail .status-code{font-weight:700;color:var(--red)}
.detail-panel .tags{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-2)}
.detail-panel .tag{padding:1px 6px;border-radius:3px;font-size:10px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted)}
.detail-panel .scenario-desc{font-size:12px;color:var(--text-muted);margin-bottom:var(--sp-3);line-height:1.5}

/* Architecture View */
.arch-view{width:100%;height:100%;position:relative}
.arch-view svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.arch-actors{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;padding:20px}
.actor-box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:var(--bg-card);border:2px solid var(--border);min-width:100px;text-align:center;transition:transform .3s,box-shadow .3s,border-color .3s;cursor:default;z-index:3}
.actor-box .actor-icon{font-size:22px;margin-bottom:4px}
.actor-box .actor-label{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.actor-box .actor-kind{font-size:9px;color:var(--text-muted);margin-top:1px}
.actor-box.active{transform:scale(1.05);animation:glowPulse 2s ease-in-out infinite}
.actor-box.from-active{border-width:2px}
.actor-group-box{position:absolute;border:1.5px dashed var(--border);border-radius:14px;z-index:0;pointer-events:none;transition:opacity .3s}
.actor-group-label{position:absolute;top:-10px;left:12px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);background:var(--bg);padding:0 6px}
.actor-box.to-active{border-width:2px}

/* Sequence View */
.seq-view{width:100%;height:100%;overflow-y:auto;overflow-x:auto;position:relative;padding:0 20px}
.seq-header{display:flex;position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 0;border-bottom:1px solid var(--border)}
.seq-actor-col{display:flex;flex-direction:column;align-items:center;min-width:120px;flex:1}
.seq-actor-col .seq-actor-box{padding:6px 8px;border-radius:8px;background:var(--bg-card);border:2px solid var(--border);text-align:center;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.seq-lifeline-area{position:relative;min-height:200px}
.seq-lifelines{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
.seq-messages{position:relative;z-index:2;padding-top:8px}
.seq-msg-row{display:flex;align-items:center;position:relative;height:40px;margin-bottom:2px;transition:opacity .3s}
.seq-msg-row.future{opacity:.2}
.seq-msg-row.current{opacity:1}
.seq-msg-row .msg-label{position:absolute;font-size:10px;white-space:nowrap;padding:1px 5px;border-radius:3px;background:rgba(13,17,23,.85);z-index:3;transform:translateY(-14px)}
.seq-msg-row .msg-n{position:absolute;left:-18px;font-size:10px;color:var(--text-dim);width:16px;text-align:right}
.seq-arrow-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* Log */
.log-entry{color:var(--text-muted)}
.log-entry .log-n{color:var(--text-dim);margin-right:var(--sp-2)}
.log-entry .log-time{color:var(--text-dim);margin-right:var(--sp-2)}
.log-entry .log-dir{font-weight:700;margin-right:var(--sp-1)}
.log-entry .log-dir.req{color:var(--blue)}
.log-entry .log-dir.res{color:var(--green)}
.log-entry .log-dir.evt{color:var(--purple)}
.log-entry .log-dir.err{color:var(--red)}
.log-entry .log-action{color:var(--text)}

/* Animations */
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px 2px var(--glow-color)}50%{box-shadow:0 0 20px 6px var(--glow-color)}}
@keyframes arrowTravel{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-3px)}20%,40%,60%,80%{transform:translateX(3px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes dashMove{to{stroke-dashoffset:-20}}

.shake{animation:shake .5s ease-in-out}
.arrow-dot{animation:arrowTravel 1s linear infinite}

/* Step type colors */
.type-http_request{background:transparent;color:var(--blue);border:1px solid rgba(79,195,247,.4)}
.type-http_response{background:transparent;color:var(--green);border:1px solid rgba(102,187,106,.4)}
.type-error{background:transparent;color:var(--red);border:1px solid rgba(239,83,80,.4)}
.type-kafka_publish,.type-kafka_consume{background:transparent;color:var(--purple);border:1px solid rgba(179,157,219,.4)}
.type-db_query{background:transparent;color:var(--gray);border:1px solid rgba(120,144,156,.4)}
.type-internal{background:transparent;color:var(--text-dim);border:1px solid rgba(85,107,138,.3)}
.type-external_api{background:transparent;color:var(--coral);border:1px solid rgba(255,138,101,.4)}
.type-cache_op{background:transparent;color:var(--red);border:1px solid rgba(239,83,80,.4)}
.type-k8s_event{background:transparent;color:var(--cyan);border:1px solid rgba(79,195,247,.4)}
.type-git_op{background:transparent;color:var(--coral);border:1px solid rgba(255,138,101,.4)}
.type-sync_op{background:transparent;color:var(--teal);border:1px solid rgba(38,198,218,.4)}
.type-ui_action{background:transparent;color:var(--ui-action);border:1px solid rgba(74,222,128,.4)}

/* Responsive */
@media(min-width:901px) and (max-width:1200px){
  .app{grid-template-columns:180px 1fr 240px}
  .sidebar{width:180px}
  .detail-panel{width:240px}
  .app.mode-reference{grid-template-columns:240px 1fr 240px}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;width:var(--sidebar-w);z-index:20;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;top:var(--header-h);background:rgba(0,0,0,.5);z-index:19}
  .sidebar-overlay.open{display:block}
  .hamburger{display:block}
  .app{grid-template-columns:0 1fr var(--detail-w)}
  .detail-panel{--detail-w:240px}
}
@media(max-width:700px){
  .app{grid-template-columns:0 1fr 0}
  .detail-panel{position:fixed;right:0;top:var(--header-h);bottom:var(--log-h);width:280px;z-index:18;transform:translateX(100%);transition:transform .25s}
  .detail-panel.open{transform:translateX(0)}
  .detail-toggle{display:flex}
  .detail-overlay{display:none;position:fixed;inset:0;top:var(--header-h);background:rgba(0,0,0,.4);z-index:17}
  .detail-overlay.open{display:block}
  .ux-flow{flex-direction:column;align-items:stretch}
  .ux-card{max-width:none;min-width:0}
  .ux-connector{transform:rotate(90deg);justify-content:center;margin:0;padding:var(--sp-1) 0}
}
.detail-toggle{display:none;position:fixed;bottom:calc(var(--log-h) + 12px);right:12px;z-index:16;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:none;cursor:pointer}

/* UX View */
.ux-view{width:100%;height:100%;overflow-x:auto;overflow-y:auto;padding:var(--sp-4);display:flex;flex-direction:column}
.ux-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:var(--sp-3);text-align:center}
.ux-empty i{font-size:48px}
.ux-empty a{color:var(--cyan);cursor:pointer;text-decoration:none}
.ux-empty a:hover{text-decoration:underline}
.ux-flow{display:flex;gap:var(--sp-4);align-items:flex-start;min-height:200px;padding-bottom:var(--sp-4)}
.ux-card{min-width:200px;max-width:240px;background:var(--bg-card);border:2px solid var(--border);border-radius:12px;padding:var(--sp-3);flex-shrink:0;transition:border-color .3s,box-shadow .3s}
.ux-card.active{border-color:var(--ui-action);box-shadow:0 0 12px rgba(74,222,128,.2)}
.ux-card-header{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);padding-bottom:var(--sp-2);border-bottom:1px solid var(--border)}
.ux-card-header i{font-size:18px;color:var(--ui-action)}
.ux-card-header span{font-size:12px;font-weight:600;color:var(--text)}
.ux-card-actions{margin-bottom:var(--sp-2)}
.ux-action-item{display:flex;align-items:flex-start;gap:var(--sp-2);font-size:11px;color:var(--text-muted);padding:3px 0;border-radius:4px;transition:background .15s}
.ux-action-item.active{background:rgba(74,222,128,.1);color:var(--ui-action)}
.ux-action-item::before{content:'○';font-size:10px;color:var(--text-dim);margin-top:1px;flex-shrink:0}
.ux-action-item.active::before{content:'●';color:var(--ui-action)}
.ux-card-apis{border-top:1px solid var(--border);padding-top:var(--sp-2);display:flex;flex-wrap:wrap;gap:4px}
.ux-api-badge{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid var(--border);color:var(--text-muted);transition:border-color .3s,color .3s}
.ux-api-badge.active{border-color:var(--blue);color:var(--blue);animation:glowPulse 2s ease-in-out infinite;--glow-color:rgba(79,195,247,.15)}
.ux-connector{display:flex;align-items:center;flex-shrink:0;color:var(--text-dim);font-size:18px;margin:0 -4px}

/* Mode System */
.mode-switcher{display:flex;gap:2px;background:var(--bg-tertiary);border-radius:8px;padding:2px;margin-left:var(--sp-3)}
.mode-switcher button{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;transition:.15s;white-space:nowrap;min-height:28px;display:inline-flex;align-items:center;gap:4px}
.mode-switcher button.active{background:rgba(79,195,247,.15);color:var(--cyan)}
.app.mode-presentation{grid-template-columns:0 1fr 0;grid-template-rows:var(--header-h) 1fr 0}
.app.mode-presentation .sidebar{transform:translateX(-100%);position:fixed;z-index:20}
.app.mode-presentation .detail-panel{position:fixed;bottom:0;left:0;right:0;height:auto;max-height:60px;padding:var(--sp-2) var(--sp-4);border-left:none;border-top:1px solid var(--border);z-index:10;overflow:hidden;grid-row:auto;top:auto;width:100%}
.app.mode-presentation .log-panel{display:none}
.app.mode-presentation .main-view{grid-column:1/-1}
.app.mode-presentation .scenario-title-overlay{position:absolute;top:var(--sp-4);left:50%;transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;color:var(--text);z-index:5;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.app.mode-reference{grid-template-columns:300px 1fr var(--detail-w)}
.app.mode-reference .sidebar{width:300px}

/* Smooth transitions */
.main-view>*{animation:viewFadeIn .2s ease-out}
@keyframes viewFadeIn{from{opacity:0}to{opacity:1}}
.sidebar{transition:width .3s ease,transform .25s}
.detail-panel{transition:width .3s ease,transform .25s,max-height .3s ease}
.log-panel{transition:height .3s ease}
.app{transition:grid-template-columns .3s ease,grid-template-rows .3s ease}

/* Zoom Controls */
.zoom-controls{position:absolute;bottom:var(--sp-3);right:var(--sp-3);display:flex;flex-direction:column;gap:4px;z-index:6}
.zoom-controls button{width:32px;height:32px;border-radius:6px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.zoom-controls button:hover{background:var(--border)}

/* Minimap */
.minimap{position:absolute;bottom:calc(var(--sp-3) + 110px);right:var(--sp-3);width:140px;height:90px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;z-index:6;overflow:hidden;cursor:pointer;opacity:.85;transition:opacity .15s}
.minimap:hover{opacity:1}
.minimap canvas{width:100%;height:100%}
.minimap .viewport-rect{position:absolute;border:1.5px solid var(--cyan);background:rgba(79,195,247,.08);pointer-events:none;transition:all .1s}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:var(--sp-2)}
.empty-state i{font-size:48px}
.empty-state p{font-size:14px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header" role="banner">
    <button class="hamburger" onclick="toggleSidebar()" title="메뉴" aria-label="사이드바 메뉴 열기/닫기"><i class="ti ti-menu-2"></i></button>
    <div class="logo"><span>Synapse</span> Flow Simulator</div>
    <div class="view-tabs">
      <button id="tab-arch" class="active" onclick="switchView('arch')">아키텍처 뷰</button>
      <button id="tab-seq" onclick="switchView('seq')">시퀀스 뷰</button>
      <button id="tab-ux" onclick="switchView('ux')">사용자 경험 뷰</button>
    </div>
    <div class="mode-switcher">
      <button data-mode="learn" onclick="setMode('learn')">📖 학습</button>
      <button data-mode="presentation" onclick="setMode('presentation')">🎬 발표</button>
      <button data-mode="reference" onclick="setMode('reference')">🔍 레퍼런스</button>
    </div>
    <div class="nav-controls">
      <button id="btn-prev" onclick="prevStep()" title="이전 (←)" aria-label="이전 단계"><i class="ti ti-chevron-left"></i></button>
      <span class="step-info" id="step-info" aria-live="polite">- / -</span>
      <button id="btn-next" onclick="nextStep()" title="다음 (→)" aria-label="다음 단계"><i class="ti ti-chevron-right"></i></button>
      <div class="sep" role="separator"></div>
      <button id="btn-play" onclick="togglePlay()" title="재생/정지 (Space)" aria-label="재생"><svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="play-path" d="M 6 4 L 20 12 L 6 20 Z" style="transition:d .25s ease"/></svg></button>
      <button class="speed-btn" id="speed-025x" onclick="setSpeed(8000)">0.25x</button>
      <button class="speed-btn" id="speed-05x" onclick="setSpeed(4000)">0.5x</button>
      <button class="speed-btn" id="speed-1x" onclick="setSpeed(2000)">1x</button>
      <button class="speed-btn" id="speed-2x" onclick="setSpeed(1000)">2x</button>
      <div class="sep"></div>
      <button onclick="resetSteps()" title="처음으로" aria-label="처음으로"><i class="ti ti-player-skip-back"></i></button>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="시나리오 목록"></nav>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="detail-overlay" id="detail-overlay" onclick="toggleDetail(false)"></div>
  <button class="detail-toggle" id="detail-toggle" onclick="toggleDetail()" aria-label="상세 패널 열기/닫기"><i class="ti ti-info-circle"></i></button>

  <!-- Main View -->
  <main class="main-view" id="main-view" role="main">
    <div class="empty-state" id="empty-state">
      <i class="ti ti-topology-star-3"></i>
      <p>왼쪽에서 시나리오를 선택하세요</p>
      <p style="font-size:12px;max-width:320px;text-align:center;line-height:1.6;margin-top:4px">인증, AI, 장애 복구, GitOps 등 18개 시나리오의<br>아키텍처 흐름을 시각적으로 탐색할 수 있습니다</p>
    </div>
  </main>

  <!-- Detail Panel -->
  <aside class="detail-panel" id="detail-panel" role="complementary" aria-label="시나리오 상세">
    <div id="detail-content">
      <div class="empty-state" style="height:auto;padding:40px 0">
        <i class="ti ti-info-circle" style="font-size:28px"></i>
        <p style="font-size:12px">시나리오를 선택하면 상세 정보가 표시됩니다</p>
      </div>
    </div>
  </aside>

  <!-- Log Panel -->
  <footer class="log-panel" id="log-panel" role="log" aria-label="실행 로그">
    <div style="color:var(--text-dim);font-size:11px">[ Synapse Flow Simulator — 로그 패널 ]</div>
  </footer>
</div>

<script>
// ── State ──
let data = null;
let actorMap = {};
let currentScenario = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let playSpeed = 2000;
let currentView = 'arch';
let selectedBranch = null;
let currentMode = 'learn';
let stepTrail = [];
let zoomLevel = 1;
let panX = 0, panY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;
let searchQuery = '';
let activeFilters = { categories: [], statuses: [], priorities: [] };
let debounceTimer = null;

function getRecentScenarios() {
  try {
    const raw = sessionStorage.getItem('recent-scenarios');
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function addRecentScenario(id) {
  let recent = getRecentScenarios().filter(r => r !== id);
  recent.unshift(id);
  if (recent.length > 3) recent = recent.slice(0, 3);
  sessionStorage.setItem('recent-scenarios', JSON.stringify(recent));
}

// ── Color Maps (read from CSS custom properties) ──
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function initColors() {
  const v = cssVar;
  window.COLOR_MAP = {blue:v('--blue'),teal:v('--teal'),coral:v('--coral'),amber:v('--amber'),pink:v('--pink'),purple:v('--purple'),red:v('--red'),green:v('--green'),gray:v('--gray'),cyan:v('--cyan'),'ui-action':v('--ui-action')};
  window.KIND_COLORS = {client:'#4FC3F7',screen:v('--ui-action'),edge:v('--purple'),datastore:v('--cyan'),broker:v('--amber'),external:v('--gray'),ops:v('--amber'),k8s:v('--cyan')};
  window.TYPE_ARROW = {
    http_request:{color:v('--blue'),dash:'',width:2},
    http_response:{color:v('--green'),dash:'8,4',width:2},
    error:{color:v('--red'),dash:'4,4',width:2},
    kafka_publish:{color:v('--purple'),dash:'',width:3},
    kafka_consume:{color:v('--purple'),dash:'',width:3},
    db_query:{color:v('--gray'),dash:'',width:1.5},
    internal:{color:v('--text-dim'),dash:'4,4',width:1.5},
    external_api:{color:v('--coral'),dash:'',width:2},
    cache_op:{color:v('--red'),dash:'',width:2},
    k8s_event:{color:v('--cyan'),dash:'',width:2},
    git_op:{color:v('--coral'),dash:'',width:2},
    sync_op:{color:v('--teal'),dash:'',width:2},
    ui_action:{color:v('--ui-action'),dash:'6,4',width:2}
  };
}

function getActorColor(actor) {
  if (actor.kind === 'service') return COLOR_MAP[actor.color] || '#3b82f6';
  return KIND_COLORS[actor.kind] || '#6b7280';
}

// ── Mode System ──
function initMode() {
  const hash = window.location.hash;
  const modeMatch = hash.match(/mode=(learn|presentation|reference)/);
  if (modeMatch) currentMode = modeMatch[1];
  else {
    const saved = sessionStorage.getItem('simulator-mode');
    if (saved && ['learn', 'presentation', 'reference'].includes(saved)) currentMode = saved;
  }
  applyMode();
}

function setMode(mode) {
  currentMode = mode;
  sessionStorage.setItem('simulator-mode', mode);
  applyMode();
  if (currentScenario) {
    renderView();
    renderDetail();
  }
  updateHash();
}

function applyMode() {
  const app = document.querySelector('.app');
  app.classList.remove('mode-learn', 'mode-presentation', 'mode-reference');
  app.classList.add('mode-' + currentMode);
  document.querySelectorAll('.mode-switcher button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });
  if (currentMode === 'presentation' && currentScenario && !isPlaying) {
    startPlay();
  }
}

// ── Zoom & Pan ──
function resetZoom() {
  zoomLevel = 1; panX = 0; panY = 0;
  applyZoomPan();
}
function zoomIn() { zoomLevel = Math.min(3, zoomLevel * 1.2); applyZoomPan(); }
function zoomOut() { zoomLevel = Math.max(0.5, zoomLevel / 1.2); applyZoomPan(); }
function applyZoomPan() {
  const container = document.querySelector('.arch-view, .seq-view');
  if (!container) return;
  const inner = container.querySelector('.arch-actors, .seq-lifeline-area');
  const svg = container.querySelector('svg');
  const transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
  [inner, svg].forEach(el => { if (el) { el.style.transform = transform; el.style.transformOrigin = '0 0'; }});
  updateMinimap();
}

function renderMinimap() {
  // Only show when zoomed and enough actors
  const actors = currentScenario ? getFilteredActors() : [];
  const mm = document.getElementById('minimap');
  if (mm) mm.remove();
  if (currentMode === 'presentation' || currentView === 'ux' || actors.length <= 8 || zoomLevel <= 1.05) return;

  const mv = document.getElementById('main-view');
  const container = document.createElement('div');
  container.className = 'minimap';
  container.id = 'minimap';

  const canvas = document.createElement('canvas');
  canvas.width = 280;
  canvas.height = 180;
  container.appendChild(canvas);

  const vpRect = document.createElement('div');
  vpRect.className = 'viewport-rect';
  vpRect.id = 'minimap-vp';
  container.appendChild(vpRect);

  container.addEventListener('click', e => {
    const rect = container.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) / rect.width;
    const clickY = (e.clientY - rect.top) / rect.height;
    const mvRect = mv.getBoundingClientRect();
    const contentW = mvRect.width * zoomLevel;
    const contentH = mvRect.height * zoomLevel;
    panX = -(clickX * contentW - mvRect.width / 2);
    panY = -(clickY * contentH - mvRect.height / 2);
    applyZoomPan();
  });

  mv.appendChild(container);

  // Draw actor dots on canvas
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 280, 180);
  const actorBoxes = mv.querySelectorAll('.actor-box');
  const mvRect = mv.getBoundingClientRect();
  actorBoxes.forEach(box => {
    const left = parseFloat(box.style.left) || 0;
    const top = parseFloat(box.style.top) || 0;
    const nx = (left + 50) / mvRect.width * 280;
    const ny = (top + 25) / mvRect.height * 180;
    const color = box.classList.contains('active') ? '#4FC3F7' : '#1e3a5f';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(nx, ny, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  updateMinimap();
}

function updateMinimap() {
  const vp = document.getElementById('minimap-vp');
  if (!vp) return;
  const mv = document.getElementById('main-view');
  const mvRect = mv.getBoundingClientRect();
  const contentW = mvRect.width * zoomLevel;
  const contentH = mvRect.height * zoomLevel;
  const vpW = (mvRect.width / contentW) * 100;
  const vpH = (mvRect.height / contentH) * 100;
  const vpX = (-panX / contentW) * 100;
  const vpY = (-panY / contentH) * 100;
  vp.style.left = Math.max(0, vpX) + '%';
  vp.style.top = Math.max(0, vpY) + '%';
  vp.style.width = Math.min(100, vpW) + '%';
  vp.style.height = Math.min(100, vpH) + '%';
}
function initZoomPan() {
  const mv = document.getElementById('main-view');
  mv.addEventListener('wheel', e => {
    if (currentView === 'ux') return;
    e.preventDefault();
    if (e.deltaY < 0) zoomIn(); else zoomOut();
  }, { passive: false });
  mv.addEventListener('mousedown', e => {
    if (currentView === 'ux' || e.button !== 0) return;
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    mv.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = e.clientX - panStartX;
    panY = e.clientY - panStartY;
    applyZoomPan();
  });
  window.addEventListener('mouseup', () => {
    if (isPanning) { isPanning = false; document.getElementById('main-view').style.cursor = ''; }
  });
}

// ── URL Hash Deep Links ──
function updateHash() {
  const parts = [];
  if (currentMode !== 'learn') parts.push(`mode=${currentMode}`);
  if (currentScenario) parts.push(`scenario=${currentScenario.id}`);
  if (currentStep > 0) parts.push(`step=${currentStep + 1}`);
  if (currentView !== 'arch') parts.push(`view=${currentView}`);
  const hash = parts.length ? '#' + parts.join('&') : '';
  if (window.location.hash !== hash) {
    history.replaceState(null, '', hash || window.location.pathname);
  }
}

function parseHash() {
  const hash = window.location.hash.slice(1);
  const params = {};
  hash.split('&').forEach(pair => {
    const [k, v] = pair.split('=');
    if (k && v) params[k] = v;
  });
  return params;
}

function restoreFromHash() {
  const params = parseHash();
  if (params.mode && ['learn', 'presentation', 'reference'].includes(params.mode)) {
    currentMode = params.mode;
    applyMode();
  }
  if (params.view && ['arch', 'seq', 'ux'].includes(params.view)) {
    switchView(params.view);
  }
  if (params.scenario && data) {
    selectScenario(params.scenario);
    if (params.step) {
      const stepNum = parseInt(params.step, 10) - 1;
      if (stepNum >= 0 && stepNum < currentScenario?.steps.length) {
        currentStep = stepNum;
        onStepChange();
      }
    }
  }
}

// ── Touch Gestures ──
function initTouchGestures() {
  const mv = document.getElementById('main-view');
  let touchStartX = 0, touchStartY = 0, touchStartDist = 0;

  mv.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
    else if (e.touches.length === 2 && currentView !== 'ux') {
      touchStartDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    }
  }, { passive: true });

  mv.addEventListener('touchend', e => {
    if (e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx > 0) prevStep(); else nextStep();
      }
    }
  }, { passive: true });

  mv.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && currentView !== 'ux') {
      const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
      if (touchStartDist > 0) {
        const scale = dist / touchStartDist;
        if (scale > 1.05) { zoomIn(); touchStartDist = dist; }
        else if (scale < 0.95) { zoomOut(); touchStartDist = dist; }
      }
    }
  }, { passive: true });

  let lastTap = 0;
  mv.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300 && e.changedTouches.length === 1) resetZoom();
    lastTap = now;
  }, { passive: true });
}

// ── Init ──
async function init() {
  try {
    const res = await fetch('data/scenarios.json');
    data = await res.json();
    data.actors.forEach(a => actorMap[a.id] = a);
    renderSidebar();
    updateSpeedButtons();
    restoreFromHash();
  } catch(e) {
    console.error('Failed to load scenarios:', e);
    document.getElementById('empty-state').innerHTML = '<i class="ti ti-alert-triangle" style="font-size:48px;color:var(--red)"></i><p>데이터 로드 실패</p><p style="font-size:11px;color:var(--text-dim)">' + e.message + '</p>';
  }
}

function filterScenarios() {
  const q = searchQuery.toLowerCase().trim();
  return data.scenarios.filter(sc => {
    if (q) {
      const searchable = [sc.title, sc.description, ...(sc.ui?.tags || []), sc.id, sc.category].join(' ').toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    if (activeFilters.categories.length && !activeFilters.categories.includes(sc.category)) return false;
    if (activeFilters.statuses.length && !activeFilters.statuses.includes(sc.status)) return false;
    if (activeFilters.priorities.length && !activeFilters.priorities.includes(sc.priority)) return false;
    return true;
  });
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const hasFilters = searchQuery || activeFilters.categories.length || activeFilters.statuses.length || activeFilters.priorities.length;
  const filtered = hasFilters ? filterScenarios() : data.scenarios;
  const filteredIds = new Set(filtered.map(s => s.id));

  let html = '';
  // Search bar
  html += `<div class="search-wrap" style="position:relative">
    <i class="ti ti-search search-icon"></i>
    <input class="search-input" id="search-input" type="text" placeholder="시나리오 검색 (Ctrl+K)" value="${escapeHtml(searchQuery)}" oninput="onSearchInput(this.value)" aria-label="시나리오 검색">
    <button class="search-clear ${searchQuery ? 'visible' : ''}" onclick="clearSearch()" aria-label="검색 초기화"><i class="ti ti-x"></i></button>
  </div>`;

  // Filter chips
  const totalActive = activeFilters.categories.length + activeFilters.statuses.length + activeFilters.priorities.length;
  html += '<div class="filter-area">';
  data.categories.forEach(cat => {
    const isActive = activeFilters.categories.includes(cat.id);
    html += `<button class="filter-chip ${isActive ? 'active' : ''}" onclick="toggleFilter('categories','${cat.id}')">${cat.label}</button>`;
  });
  ['implemented', 'partial', 'pending'].forEach(s => {
    const isActive = activeFilters.statuses.includes(s);
    const labels = { implemented: '구현완료', partial: '부분구현', pending: '대기' };
    html += `<button class="filter-chip ${isActive ? 'active' : ''}" onclick="toggleFilter('statuses','${s}')">${labels[s]}</button>`;
  });
  if (totalActive > 0) {
    html += `<button class="filter-chip" onclick="clearSearch()" style="border-color:var(--red);color:var(--red)">초기화<span class="filter-count" style="background:var(--red)">${totalActive}</span></button>`;
  }
  html += '</div>';

  // Recent scenarios
  const recentIds = getRecentScenarios();
  const recentScenarios = recentIds.map(id => data.scenarios.find(s => s.id === id)).filter(Boolean);
  if (recentScenarios.length > 0 && !searchQuery && !totalActive) {
    html += '<div class="recent-section"><div class="recent-label">최근</div>';
    recentScenarios.forEach(sc => {
      html += `<button class="sc-item ${currentScenario?.id === sc.id ? 'active' : ''}" data-id="${sc.id}" onclick="selectScenario('${sc.id}')" type="button" style="padding-left:var(--sp-3)">
        <span class="status-dot status-${sc.status}" title="${sc.status}"></span>${escapeHtml(sc.title)}
      </button>`;
    });
    html += '</div>';
  }

  // Scenario list
  if (filtered.length === 0) {
    html += '<div class="no-results"><p>검색 결과 없음</p><button onclick="clearSearch()">필터 초기화</button></div>';
  } else {
    data.categories.forEach(cat => {
      const catScenarios = data.scenarios.filter(s => s.category === cat.id && filteredIds.has(s.id));
      if (catScenarios.length === 0) return;
      const catColor = COLOR_MAP[cat.color] || '#6b7280';
      html += `<div class="cat-group"><div class="cat-header"><span class="cat-dot" style="background:${catColor}"></span>${cat.label}</div>`;
      catScenarios.forEach(sc => {
        const stepCount = sc.steps.length;
        const tags = (sc.ui?.tags || []).slice(0, 3);
        html += `<button class="sc-item ${currentScenario?.id === sc.id ? 'active' : ''}" data-id="${sc.id}" onclick="selectScenario('${sc.id}')" type="button">
          <div><span class="status-dot status-${sc.status}" title="${sc.status}"></span>${highlightMatch(sc.title, searchQuery)}</div>
          <div class="sc-meta">
            ${tags.map(t => `<span class="sc-tag">${escapeHtml(t)}</span>`).join('')}
            <span class="sc-steps">${stepCount}steps</span>
          </div>
        </button>`;
      });
      html += '</div>';
    });
  }
  sb.innerHTML = html;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const q = query.toLowerCase();
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx + query.length));
  const after = escapeHtml(text.slice(idx + query.length));
  return `${before}<mark style="background:rgba(79,195,247,.25);color:var(--text);border-radius:2px;padding:0 1px">${match}</mark>${after}`;
}

function onSearchInput(value) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQuery = value;
    renderSidebar();
  }, 150);
}

function clearSearch() {
  searchQuery = '';
  activeFilters = { categories: [], statuses: [], priorities: [] };
  renderSidebar();
  const input = document.getElementById('search-input');
  if (input) input.focus();
}

function toggleFilter(type, value) {
  const arr = activeFilters[type];
  const idx = arr.indexOf(value);
  if (idx === -1) arr.push(value);
  else arr.splice(idx, 1);
  renderSidebar();
}

// ── Scenario Selection ──
function selectScenario(id) {
  const sc = data.scenarios.find(s => s.id === id);
  if (!sc) return;
  currentScenario = sc;
  addRecentScenario(sc.id);
  currentStep = 0;
  selectedBranch = null;
  resetZoom();
  stopPlay();
  clearLog();
  document.querySelectorAll('.sc-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  document.getElementById('empty-state')?.remove();
  renderView();
  renderDetail();
  updateStepInfo();
  logStep(0);
  updateHash();
  // close sidebar on mobile
  if (window.innerWidth <= 900) toggleSidebar(false);
}

// ── View Switching ──
function switchView(view) {
  currentView = view;
  document.getElementById('tab-arch').classList.toggle('active', view === 'arch');
  document.getElementById('tab-seq').classList.toggle('active', view === 'seq');
  document.getElementById('tab-ux').classList.toggle('active', view === 'ux');
  if (currentScenario) renderView();
  updateHash();
}

function renderView() {
  if (!currentScenario) return;
  if (currentView === 'arch') renderArchView();
  else if (currentView === 'seq') renderSeqView();
  else if (currentView === 'ux') renderUxView();
}

// ── Architecture View ──
function renderArchView() {
  const mv = document.getElementById('main-view');
  const actors = getFilteredActors();
  // Group by kind rows
  const kindOrder = ['client','screen','edge','service','ops','k8s','broker','datastore','external'];
  const rows = {};
  actors.forEach(a => {
    const k = a.kind;
    if (!rows[k]) rows[k] = [];
    rows[k].push(a);
  });
  // Split long rows: max 4 actors per visual row, wrap to next line
  const maxPerRow = 4;
  const visualRows = [];
  kindOrder.filter(k => rows[k]).forEach(k => {
    const actors = rows[k];
    for (let i = 0; i < actors.length; i += maxPerRow) {
      visualRows.push(actors.slice(i, i + maxPerRow));
    }
  });

  const allSteps = getFilteredSteps();
  const step = allSteps[Math.min(currentStep, allSteps.length - 1)];
  const fromId = step?.from;
  const toId = step?.to;

  let html = '<div class="arch-view"><svg id="arch-svg"></svg><div class="arch-actors" id="arch-actors">';
  const totalRows = visualRows.length;
  const positions = {};
  const rect = mv.getBoundingClientRect();
  const areaW = rect.width - 40;
  const areaH = rect.height - 40;
  const nodeW = 120; // approx actor box width
  const padX = 60;
  const padY = 40;

  visualRows.forEach((row, ri) => {
    const y = totalRows === 1 ? areaH / 2 : padY + (ri / Math.max(1, totalRows - 1)) * (areaH - padY * 2 - 60);
    const totalRowW = row.length * nodeW + (row.length - 1) * 20;
    const startX = Math.max(padX, (areaW - totalRowW) / 2);
    row.forEach((actor, ci) => {
      const x = row.length === 1 ? areaW / 2 : startX + ci * (nodeW + 20);
      const clampedX = Math.max(padX, Math.min(x, areaW - nodeW));
      const clampedY = Math.max(padY, Math.min(y, areaH - 80));
      positions[actor.id] = { x: clampedX + 50, y: clampedY + 30 };
      const color = getActorColor(actor);
      const isFrom = actor.id === fromId;
      const isTo = actor.id === toId;
      const isActive = isFrom || isTo;
      const cls = ['actor-box'];
      if (isActive) cls.push('active');
      if (isFrom) cls.push('from-active');
      if (isTo) cls.push('to-active');
      const glowColor = isActive ? color : 'transparent';
      const borderColor = isActive ? color : 'var(--border)';
      const kindIcons = {client:'ti-device-desktop',screen:'ti-app-window',edge:'ti-network',service:'ti-server-2',datastore:'ti-database',broker:'ti-broadcast',external:'ti-cloud',ops:'ti-settings-automation',k8s:'ti-box'};
      const kindIcon = kindIcons[actor.kind] || actor.icon;
      const gradient = `linear-gradient(135deg, ${color}08, transparent)`;
      html += `<div class="${cls.join(' ')}" style="left:${clampedX}px;top:${clampedY}px;border-color:${borderColor};--glow-color:${color}40;background:${gradient}" data-actor="${actor.id}">
        <i class="ti ${kindIcon} actor-icon" style="color:${color}"></i>
        <span class="actor-label">${actor.label}</span>
        <span class="actor-kind">${actor.kind}</span>
      </div>`;
    });
  });
  html += '</div></div>';
  mv.innerHTML = html;

  // Draw actor group boxes
  if (data.actorGroups) {
    const actorIds = new Set(actors.map(a => a.id));
    const archActors = document.getElementById('arch-actors');
    data.actorGroups.forEach(group => {
      const visibleMembers = group.members.filter(m => actorIds.has(m));
      if (visibleMembers.length < 2) return;
      const memberPositions = visibleMembers.map(m => positions[m]).filter(Boolean);
      if (memberPositions.length < 2) return;
      const padding = 28;
      const halfNodeW = 65; // half of actor-box min-width + padding
      const halfNodeH = 40; // half of actor-box approx height
      const minX = Math.min(...memberPositions.map(p => p.x)) - halfNodeW - padding;
      const maxX = Math.max(...memberPositions.map(p => p.x)) + halfNodeW + padding;
      const minY = Math.min(...memberPositions.map(p => p.y)) - halfNodeH - padding;
      const maxY = Math.max(...memberPositions.map(p => p.y)) + halfNodeH + padding;
      const box = document.createElement('div');
      box.className = 'actor-group-box';
      box.style.cssText = `left:${minX}px;top:${minY}px;width:${maxX - minX}px;height:${maxY - minY}px`;
      const label = document.createElement('span');
      label.className = 'actor-group-label';
      label.textContent = group.label;
      box.appendChild(label);
      archActors.appendChild(box);
    });
  }

  // Presentation title overlay
  if (currentMode === 'presentation') {
    const overlay = document.createElement('div');
    overlay.className = 'scenario-title-overlay';
    overlay.textContent = currentScenario.title;
    mv.querySelector('.arch-view')?.prepend(overlay);
  }

  // Add zoom controls
  if (currentMode !== 'presentation') {
    const zc = document.createElement('div');
    zc.className = 'zoom-controls';
    zc.innerHTML = `<button onclick="zoomIn()" title="확대" aria-label="확대"><i class="ti ti-plus"></i></button><button onclick="zoomOut()" title="축소" aria-label="축소"><i class="ti ti-minus"></i></button><button onclick="resetZoom()" title="맞추기" aria-label="화면 맞추기"><i class="ti ti-arrows-maximize"></i></button>`;
    mv.appendChild(zc);
  }

  // Minimap + Draw arrow
  requestAnimationFrame(() => {
    drawArchArrow(step, positions);
    renderMinimap();
  });
}

function buildBezierPath(from, to, isSelf) {
  if (isSelf) {
    return `M ${from.x + 50} ${from.y} C ${from.x + 110} ${from.y - 40}, ${from.x + 110} ${from.y + 40}, ${from.x + 50} ${from.y}`;
  }
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const cx1 = from.x + dx * 0.3;
  const cy1 = from.y + dy * 0.05;
  const cx2 = from.x + dx * 0.7;
  const cy2 = to.y - dy * 0.05;
  return `M ${from.x} ${from.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${to.x} ${to.y}`;
}

function drawArchArrow(currentStepObj, positions) {
  const svg = document.getElementById('arch-svg');
  if (!svg) return;

  let svgContent = '<defs>';
  const markerTypes = new Set();
  currentScenario.steps.forEach(s => markerTypes.add(s.type));
  markerTypes.forEach(type => {
    const ts = TYPE_ARROW[type] || TYPE_ARROW.internal;
    svgContent += `<marker id="ah-${type}" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="${ts.color}"/></marker>`;
  });
  svgContent += '</defs>';

  // Trail arrows (past steps, faded)
  const trailSteps = stepTrail.slice(0, -1);
  const trailSet = new Set();
  trailSteps.forEach(idx => {
    const step = currentScenario.steps[idx];
    if (!step || step.type === 'ui_action') return;
    const key = `${step.from}-${step.to}-${step.type}`;
    if (trailSet.has(key)) return;
    trailSet.add(key);
    const from = positions[step.from];
    const to = positions[step.to];
    if (!from || !to) return;
    const ts = TYPE_ARROW[step.type] || TYPE_ARROW.internal;
    const pathD = buildBezierPath(from, to, step.from === step.to);
    const dashAttr = ts.dash ? `stroke-dasharray="${ts.dash}"` : '';
    svgContent += `<path d="${pathD}" fill="none" stroke="${ts.color}" stroke-width="1.5" ${dashAttr} opacity="0.25" marker-end="url(#ah-${step.type})"/>`;
  });

  // Current step arrow (bold)
  if (currentStepObj) {
    const from = positions[currentStepObj.from];
    const to = positions[currentStepObj.to];
    if (from && to) {
      const ts = TYPE_ARROW[currentStepObj.type] || TYPE_ARROW.internal;
      const pathD = buildBezierPath(from, to, currentStepObj.from === currentStepObj.to);
      const dashAttr = ts.dash ? `stroke-dasharray="${ts.dash}"` : '';
      let animDash = '';
      if (ts.dash) animDash = `<animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/>`;
      svgContent += `<path d="${pathD}" fill="none" stroke="${ts.color}" stroke-width="3" ${dashAttr} opacity="0.9" marker-end="url(#ah-${currentStepObj.type})">${animDash}</path>`;
      svgContent += `<circle r="4" fill="${ts.color}" opacity="0.9"><animateMotion dur="1.2s" repeatCount="indefinite" path="${pathD}"/></circle>`;

      const mx = (from.x + to.x) / 2;
      const my = (from.y + to.y) / 2;
      const labelText = escapeHtml(truncate(currentStepObj.action, 35));
      const labelW = Math.min(labelText.length * 6, 220);
      const labelH = currentStepObj.topic ? 28 : 16;
      svgContent += `<rect x="${mx - labelW/2 - 4}" y="${my - 18}" width="${labelW + 8}" height="${labelH}" rx="4" fill="var(--bg)" fill-opacity="0.85"/>`;
      svgContent += `<text x="${mx}" y="${my - 6}" text-anchor="middle" fill="var(--text)" font-size="10" font-weight="500">${labelText}</text>`;
      if (currentStepObj.topic) {
        svgContent += `<text x="${mx}" y="${my + 8}" text-anchor="middle" fill="${ts.color}" font-size="9" opacity="0.7">${currentStepObj.topic.split('.').pop()}</text>`;
      }
    }
  }

  svg.innerHTML = svgContent;

  if (currentStepObj?.type === 'error') {
    [currentStepObj.from, currentStepObj.to].forEach(id => {
      const box = document.querySelector(`[data-actor="${id}"]`);
      if (box) { box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 600); }
    });
  }
}

// ── Sequence View ──
function renderSeqView() {
  const mv = document.getElementById('main-view');
  const actors = getFilteredActors();
  const steps = getFilteredSteps();
  const colW = Math.max(120, Math.min(160, (mv.getBoundingClientRect().width - 40) / actors.length));
  const actorIdx = {};
  actors.forEach((a, i) => actorIdx[a.id] = i);

  let headerHtml = '<div class="seq-header" style="padding-left:24px">';
  actors.forEach(a => {
    const color = getActorColor(a);
    headerHtml += `<div class="seq-actor-col" style="min-width:${colW}px;max-width:${colW}px">
      <div class="seq-actor-box" style="border-color:${color}"><i class="${a.icon}" style="color:${color};margin-right:4px"></i>${a.label}</div>
    </div>`;
  });
  headerHtml += '</div>';

  const rowH = 42;
  const totalH = steps.length * rowH + 40;

  let msgsHtml = '<div class="seq-messages" style="position:relative;padding-left:24px">';
  let svgLines = '';

  // Lifelines
  actors.forEach((a, i) => {
    const x = i * colW + colW / 2;
    const color = getActorColor(a);
    svgLines += `<line x1="${x}" y1="0" x2="${x}" y2="${totalH}" stroke="${color}" stroke-width="1" stroke-dasharray="4,4" opacity="0.2"/>`;
  });

  // Messages
  const mappedStep = Math.min(currentStep, steps.length - 1);
  steps.forEach((step, si) => {
    const fi = actorIdx[step.from] ?? 0;
    const ti = actorIdx[step.to] ?? 0;
    const isCurrent = si === mappedStep;
    const isFuture = si > mappedStep;
    const cls = isCurrent ? 'current' : (isFuture ? 'future' : '');
    const typeStyle = TYPE_ARROW[step.type] || TYPE_ARROW.internal;

    const x1 = fi * colW + colW / 2;
    const x2 = ti * colW + colW / 2;
    const y = si * rowH + 20;
    const isSelf = step.from === step.to;

    let dashAttr = typeStyle.dash ? `stroke-dasharray="${typeStyle.dash}"` : '';
    const opacity = isFuture ? 0.15 : (isCurrent ? 1 : 0.6);
    const sw = isCurrent ? typeStyle.width + 0.5 : typeStyle.width;

    if (isSelf) {
      const loopW = 30;
      svgLines += `<path d="M ${x1} ${y} C ${x1 + loopW} ${y - 12}, ${x1 + loopW} ${y + 12}, ${x1} ${y}" fill="none" stroke="${typeStyle.color}" stroke-width="${sw}" ${dashAttr} opacity="${opacity}"/>`;
    } else {
      const mid = `arrow-${si}`;
      svgLines += `<defs><marker id="${mid}" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="${typeStyle.color}"/></marker></defs>`;
      svgLines += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${typeStyle.color}" stroke-width="${sw}" ${dashAttr} marker-end="url(#${mid})" opacity="${opacity}"/>`;
      if (isCurrent) {
        const pathD = `M ${x1} ${y} L ${x2} ${y}`;
        svgLines += `<circle r="3" fill="${typeStyle.color}"><animateMotion dur="1s" repeatCount="indefinite" path="${pathD}"/></circle>`;
      }
    }

    // Label
    const labelX = isSelf ? x1 + 35 : (x1 + x2) / 2;
    const labelAnchor = isSelf ? 'start' : 'middle';
    svgLines += `<text x="${labelX}" y="${y - 6}" text-anchor="${labelAnchor}" fill="${isCurrent ? 'var(--text)' : 'var(--text-muted)'}" font-size="${isCurrent ? 10.5 : 9.5}" font-weight="${isCurrent ? 600 : 400}" opacity="${opacity}">${step.n}. ${escapeHtml(truncate(step.action, 35))}</text>`;

    if (step.topic && !isFuture) {
      svgLines += `<text x="${labelX}" y="${y + 14}" text-anchor="${labelAnchor}" fill="${typeStyle.color}" font-size="8.5" opacity="${opacity * 0.7}">${step.topic.split('.').pop()}</text>`;
    }
  });

  msgsHtml += '</div>';

  mv.innerHTML = `<div class="seq-view">${headerHtml}
    <div class="seq-lifeline-area" style="height:${totalH}px;position:relative;padding-left:24px">
      <svg class="seq-arrow-svg" style="width:${actors.length * colW}px;height:${totalH}px">${svgLines}</svg>
    </div>
  </div>`;

  // Add zoom controls
  if (currentMode !== 'presentation') {
    const zc = document.createElement('div');
    zc.className = 'zoom-controls';
    zc.innerHTML = `<button onclick="zoomIn()" title="확대" aria-label="확대"><i class="ti ti-plus"></i></button><button onclick="zoomOut()" title="축소" aria-label="축소"><i class="ti ti-minus"></i></button><button onclick="resetZoom()" title="맞추기" aria-label="화면 맞추기"><i class="ti ti-arrows-maximize"></i></button>`;
    mv.appendChild(zc);
  }

  // Presentation title overlay
  if (currentMode === 'presentation') {
    const overlay = document.createElement('div');
    overlay.className = 'scenario-title-overlay';
    overlay.textContent = currentScenario.title;
    mv.querySelector('.seq-view')?.prepend(overlay);
  }

  // Scroll to current step
  const seqView = mv.querySelector('.seq-view');
  if (seqView) {
    const targetY = mappedStep * rowH;
    seqView.scrollTop = Math.max(0, targetY - 120);
  }
  renderMinimap();
}

// ── UX View ──
function renderUxView() {
  const mv = document.getElementById('main-view');
  if (!hasScreenActors()) {
    const journeyScenarios = data.scenarios.filter(s =>
      s.category === 'journey-learner' || s.category === 'journey-admin'
    );
    let links = journeyScenarios.slice(0, 3).map(s =>
      `<a onclick="selectScenario('${s.id}')">${escapeHtml(s.title)}</a>`
    ).join('<br>');
    mv.innerHTML = `<div class="ux-empty">
      <i class="ti ti-device-mobile-off"></i>
      <p style="font-size:14px">이 시나리오에는 사용자 경험 흐름이<br>정의되어 있지 않습니다</p>
      <div style="font-size:12px;margin-top:var(--sp-2)">
        <p style="margin-bottom:var(--sp-2)">다음 여정 시나리오를 확인해보세요:</p>
        ${links}
      </div>
    </div>`;
    return;
  }

  const screens = buildScreenCards();
  let html = '<div class="ux-view"><div class="ux-flow">';

  screens.forEach((screen, idx) => {
    const isActive = screen.actions.some(a => a.stepIdx === currentStep) ||
                     screen.apis.some(a => a.stepIdx === currentStep);

    html += `<div class="ux-card ${isActive ? 'active' : ''}">`;
    html += `<div class="ux-card-header"><i class="${screen.icon}"></i><span>${escapeHtml(screen.label)}</span></div>`;
    if (screen.actions.length) {
      html += '<div class="ux-card-actions">';
      screen.actions.forEach(a => {
        const isCurrentAction = a.stepIdx === currentStep;
        html += `<div class="ux-action-item ${isCurrentAction ? 'active' : ''}">${escapeHtml(a.action)}</div>`;
      });
      html += '</div>';
    }
    if (screen.apis.length) {
      html += '<div class="ux-card-apis">';
      screen.apis.forEach(a => {
        const isCurrentApi = a.stepIdx === currentStep;
        html += `<span class="ux-api-badge ${isCurrentApi ? 'active' : ''}">${escapeHtml(truncate(a.action, 25))}</span>`;
      });
      html += '</div>';
    }
    html += '</div>';
    if (idx < screens.length - 1) {
      html += '<div class="ux-connector"><i class="ti ti-chevron-right"></i></div>';
    }
  });

  html += '</div></div>';
  mv.innerHTML = html;

  const activeCard = mv.querySelector('.ux-card.active');
  if (activeCard) {
    activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
}

function buildScreenCards() {
  const steps = currentScenario.steps;
  const cards = [];
  let currentScreenCard = null;

  steps.forEach((step, idx) => {
    if (step.type === 'ui_action') {
      const toActor = actorMap[step.to];
      const fromActor = actorMap[step.from];
      const screenActor = (toActor?.kind === 'screen') ? toActor : (fromActor?.kind === 'screen' ? fromActor : null);
      if (screenActor) {
        let card = (cards.length > 0 && cards[cards.length - 1].id === screenActor.id) ? cards[cards.length - 1] : null;
        if (!card) {
          card = {
            id: screenActor.id,
            label: screenActor.label,
            icon: screenActor.icon || 'ti ti-app-window',
            actions: [],
            apis: []
          };
          cards.push(card);
        }
        card.actions.push({ action: step.action, stepIdx: idx });
        currentScreenCard = card;
      }
    } else if (currentScreenCard) {
      currentScreenCard.apis.push({ action: step.action, stepIdx: idx });
    }
  });

  return cards;
}

// ── Detail Panel ──

  if (!currentScenario) return;
  const dc = document.getElementById('detail-content');

  // Presentation mode: minimal detail
  if (currentMode === 'presentation') {
    if (step) {
      dc.innerHTML = `<div style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        <strong>${step.n}</strong> ${escapeHtml(step.action)}
      </div>`;
    } else {
      dc.innerHTML = '';
    }
    return;
  }

  let html = '';

  // Scenario info
  html += `<div class="section">
    <h3>시나리오</h3>
    <div class="step-title">${escapeHtml(sc.title)}</div>
    <div class="scenario-desc">${escapeHtml(sc.description)}</div>`;
  if (sc.ui?.tags) {
    html += '<div class="tags">';
    sc.ui.tags.forEach(t => html += `<span class="tag">${escapeHtml(t)}</span>`);
    html += '</div>';
  }
  html += '</div>';

  // Current step info
  if (step) {
    const typeStyle = TYPE_ARROW[step.type] || TYPE_ARROW.internal;
    const fromActor = actorMap[step.from];
    const toActor = actorMap[step.to];
    html += `<div class="section">
      <h3>현재 스텝</h3>
      <div class="step-title">${step.n}단계</div>
      <span class="step-type type-${step.type}">${step.type}</span>
      <div class="step-action">${escapeHtml(step.action)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
        <span style="color:${fromActor ? getActorColor(fromActor) : 'inherit'}">${fromActor?.label || step.from}</span>
        <i class="ti ti-arrow-right" style="margin:0 4px;font-size:10px"></i>
        <span style="color:${toActor ? getActorColor(toActor) : 'inherit'}">${toActor?.label || step.to}</span>
      </div>`;

    if (step.topic) {
      html += `<div style="font-size:11px;margin-bottom:8px"><i class="ti ti-broadcast" style="color:var(--purple);margin-right:4px"></i><span style="color:var(--purple)">${escapeHtml(step.topic)}</span></div>`;
    }
    if (step.duration) {
      html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px"><i class="ti ti-clock" style="margin-right:4px"></i>${formatDuration(step.duration)}</div>`;
    }
    html += '</div>';

    // Payload
    if (step.payload) {
      html += `<div class="section"><h3>페이로드</h3><div class="payload-block">${escapeHtml(JSON.stringify(step.payload, null, 2))}</div></div>`;
    }

    // Learn mode: guide text
    if (currentMode === 'learn' && step.guide) {
      html += `<div class="section"><h3>학습 가이드</h3>
        <div style="font-size:12px;color:var(--text);line-height:1.6;padding:var(--sp-2) var(--sp-3);background:var(--bg);border-radius:6px;border-left:3px solid var(--teal)">${escapeHtml(step.guide)}</div>
      </div>`;
    }

    // Reference mode: Kafka topic details
    if (currentMode === 'reference' && step.topic) {
      const topicData = data.topics?.find(t => t.name === step.topic);
      if (topicData) {
        html += `<div class="section"><h3>토픽 상세</h3>
          <div style="font-size:11px;color:var(--text-muted);line-height:1.6">
            <div><strong>프로듀서:</strong> ${topicData.producers.join(', ')}</div>
            <div><strong>컨슈머:</strong> ${topicData.consumers.join(', ')}</div>
            <div><strong>호환성:</strong> ${topicData.compatibility}</div>
            ${topicData.description ? `<div style="margin-top:4px">${escapeHtml(topicData.description)}</div>` : ''}
          </div>
        </div>`;
      }
    }

    // Annotations
    if (step.annotations?.length) {
      html += '<div class="section"><h3>주석</h3>';
      step.annotations.forEach(a => {
        if (currentMode === 'learn') {
          html += `<div class="annotation" style="background:var(--bg);padding:var(--sp-2);border-radius:4px;border-left:3px solid var(--amber);margin-bottom:var(--sp-2)">${escapeHtml(a)}</div>`;
        } else {
          html += `<div class="annotation">${escapeHtml(a)}</div>`;
        }
      });
      html += '</div>';
    }
  }

  // Branches
  if (sc.branches) {
    const relevantFailures = (sc.branches.failures || []).filter(b => !step || b.afterStep <= step.n);
    const relevantAlts = (sc.branches.alternates || []).filter(b => !step || b.afterStep <= step.n);

    if (relevantFailures.length || relevantAlts.length) {
      html += '<div class="section branch-section"><h3>분기</h3>';
      relevantFailures.forEach(b => {
        const isSelected = selectedBranch === b.id;
        html += `<button class="branch-item failure ${isSelected ? 'active' : ''}" onclick="toggleBranch('${b.id}')">
          <div class="trigger"><i class="ti ti-alert-triangle" style="color:var(--red);font-size:12px;margin-right:4px"></i>${escapeHtml(b.trigger)}</div>
          <div class="result">Step ${b.afterStep} 이후</div>
        </button>`;
        if (isSelected) {
          html += `<div class="branch-detail">`;
          if (b.result.status) html += `<div><span class="status-code">${b.result.status}</span> ${b.result.code || ''}</div>`;
          if (b.result.message) html += `<div style="margin-top:4px">${escapeHtml(b.result.message)}</div>`;
          if (b.recovery) html += `<div style="margin-top:4px;color:var(--green)"><i class="ti ti-refresh" style="margin-right:3px"></i>${escapeHtml(b.recovery)}</div>`;
          html += '</div>';
        }
      });
      relevantAlts.forEach(b => {
        const isSelected = selectedBranch === b.id;
        html += `<button class="branch-item alternate ${isSelected ? 'active' : ''}" onclick="toggleBranch('${b.id}')">
          <div class="trigger"><i class="ti ti-switch-horizontal" style="color:var(--amber);font-size:12px;margin-right:4px"></i>${escapeHtml(b.trigger)}</div>
          <div class="result">Step ${b.afterStep} 이후</div>
        </button>`;
        if (isSelected) {
          html += `<div class="branch-detail">`;
          if (b.result.status) html += `<div><span style="font-weight:700;color:var(--amber)">${b.result.status}</span> ${b.result.code || ''}</div>`;
          if (b.result.message) html += `<div style="margin-top:4px">${escapeHtml(b.result.message)}</div>`;
          html += '</div>';
        }
      });
      html += '</div>';
    }
  }

  dc.innerHTML = html;
}

function toggleBranch(id) {
  selectedBranch = selectedBranch === id ? null : id;
  renderDetail();
}

// ── Step Navigation ──
function updateStepInfo() {
  const info = document.getElementById('step-info');
  if (!currentScenario) { info.textContent = '- / -'; return; }
  info.textContent = `${currentStep + 1} / ${currentScenario.steps.length}`;
}

function nextStep() {
  if (!currentScenario) return;
  if (currentStep < currentScenario.steps.length - 1) {
    currentStep++;
    onStepChange();
  } else if (isPlaying) {
    stopPlay();
  }
}

function prevStep() {
  if (!currentScenario || currentStep <= 0) return;
  currentStep--;
  onStepChange();
}

function resetSteps() {
  if (!currentScenario) return;
  currentStep = 0;
  stepTrail = [];
  stopPlay();
  clearLog();
  onStepChange();
  logStep(0);
}

function onStepChange() {
  stepTrail.push(currentStep);
  if (stepTrail.length > 20) stepTrail.shift();
  renderView();
  renderDetail();
  updateStepInfo();
  logStep(currentStep);
  updateHash();
}

function togglePlay() {
  if (isPlaying) stopPlay();
  else startPlay();
}

function startPlay() {
  if (!currentScenario) return;
  isPlaying = true;
  morphPlayIcon(true);
  playInterval = setInterval(() => nextStep(), playSpeed);
}

function stopPlay() {
  isPlaying = false;
  morphPlayIcon(false);
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function morphPlayIcon(toPause) {
  const path = document.getElementById('play-path');
  if (!path) return;
  if (toPause) {
    path.setAttribute('d', 'M 6 4 L 6 20 M 14 4 L 14 20 M 18 4 L 18 20');
    path.style.fill = 'none';
  } else {
    path.setAttribute('d', 'M 6 4 L 20 12 L 6 20 Z');
    path.style.fill = 'none';
  }
}

function setSpeed(ms) {
  playSpeed = ms;
  updateSpeedButtons();
  if (isPlaying) { stopPlay(); startPlay(); }
}

function updateSpeedButtons() {
  document.getElementById('speed-025x').classList.toggle('active', playSpeed === 8000);
  document.getElementById('speed-05x').classList.toggle('active', playSpeed === 4000);
  document.getElementById('speed-1x').classList.toggle('active', playSpeed === 2000);
  document.getElementById('speed-2x').classList.toggle('active', playSpeed === 1000);
}

// ── Log Panel ──
function clearLog() {
  document.getElementById('log-panel').innerHTML = '<div style="color:var(--text-dim);font-size:11px">[ Synapse Flow Simulator -- 로그 패널 ]</div>';
}

function logStep(idx) {
  if (!currentScenario) return;
  const step = currentScenario.steps[idx];
  if (!step) return;
  const lp = document.getElementById('log-panel');
  const type = step.type;
  const typeIcons = {http_request:'ti-arrow-right',http_response:'ti-arrow-left',error:'ti-alert-triangle',kafka_publish:'ti-broadcast',kafka_consume:'ti-broadcast',db_query:'ti-database',internal:'ti-arrows-exchange',external_api:'ti-cloud',cache_op:'ti-database',k8s_event:'ti-box',git_op:'ti-git-merge',sync_op:'ti-refresh',ui_action:'ti-click'};
  let dir = 'evt';
  let dirLabel = 'EVT';
  if (type === 'http_request') { dir = 'req'; dirLabel = 'REQ'; }
  else if (type === 'http_response') { dir = 'res'; dirLabel = 'RES'; }
  else if (type === 'error') { dir = 'err'; dirLabel = 'ERR'; }
  else if (type.startsWith('kafka')) { dir = 'evt'; dirLabel = type === 'kafka_publish' ? 'PUB' : 'SUB'; }
  else if (type === 'ui_action') { dir = 'evt'; dirLabel = 'UI'; }

  const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const topicStr = step.topic ? ` [${step.topic}]` : '';
  const icon = typeIcons[type] || 'ti-point';

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.style.animation = 'fadeInUp .2s ease';
  entry.innerHTML = `<span class="log-n">#${String(step.n).padStart(2, '0')}</span><span class="log-time">${time}</span><i class="ti ${icon}" style="font-size:11px;margin-right:4px;color:${(TYPE_ARROW[type]||TYPE_ARROW.internal).color}"></i><span class="log-dir ${dir}">${dirLabel}</span><span class="log-action">${escapeHtml(step.from)} → ${escapeHtml(step.to)}: ${escapeHtml(step.action)}${topicStr}</span>`;
  lp.appendChild(entry);
  lp.scrollTop = lp.scrollHeight;
}

// ── Helpers ──
function getScenarioActors() {
  if (!currentScenario) return [];
  // Use scenario's actor ID list, plus any extra actors referenced in steps
  const ids = new Set(currentScenario.actors || []);
  currentScenario.steps.forEach(s => { ids.add(s.from); ids.add(s.to); });
  return Array.from(ids).map(id => actorMap[id]).filter(Boolean);
}

function getFilteredSteps() {
  if (!currentScenario) return [];
  if (currentView === 'ux') return currentScenario.steps;
  return currentScenario.steps.filter(s => s.type !== 'ui_action');
}

function getFilteredActors() {
  if (!currentScenario) return [];
  if (currentView === 'ux') return getScenarioActors();
  return getScenarioActors().filter(a => a.kind !== 'screen');
}

function hasScreenActors() {
  if (!currentScenario) return false;
  return getScenarioActors().some(a => a.kind === 'screen');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function truncate(s, n) {
  if (!s || s.length <= n) return s;
  return s.slice(0, n) + '...';
}

function formatDuration(ms) {
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return (ms / 60000).toFixed(1) + 'min';
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const isOpen = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  ov.classList.toggle('open', isOpen);
}

function toggleDetail(force) {
  const dp = document.getElementById('detail-panel');
  const ov = document.getElementById('detail-overlay');
  const isOpen = force !== undefined ? force : !dp.classList.contains('open');
  dp.classList.toggle('open', isOpen);
  ov.classList.toggle('open', isOpen);
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case 'ArrowRight': e.preventDefault(); nextStep(); break;
    case 'ArrowLeft': e.preventDefault(); prevStep(); break;
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'Home': e.preventDefault(); resetSteps(); break;
    case 'f':
    case 'F':
      if (currentMode === 'presentation') {
        e.preventDefault();
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
      break;
    case 'k':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.focus();
      }
      break;
  }
});

// ── Resize ──
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (currentScenario) renderView(); }, 150);
});

// ── Boot ──
initColors();
initMode();
initZoomPan();
initTouchGestures();
init();
</script>
